services:
    laravel.test:
        build:
            context: './vendor/laravel/sail/runtimes/8.4'
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP}'
        image: 'sail-8.4/app'
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
            - '${APP_PORT:-80}:80'
            - '${VITE_PORT:-5173}:${VITE_PORT:-5173}'
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
            XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
            XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
            IGNITION_LOCAL_SITES_PATH: '${PWD}'
        volumes:
            - '.:/var/www/html'
            # Keep vendor/ on the container's own disk: loading thousands of PHP files
            # through the Windows bind mount makes every request take seconds.
            - 'sail-vendor:/var/www/html/vendor'
        networks:
            - sail

    queue:
        image: 'sail-8.4/app'
        command: php artisan queue:work --tries=3 --timeout=90 --sleep=3
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
        volumes:
            - '.:/var/www/html'
            # Keep vendor/ on the container's own disk: loading thousands of PHP files
            # through the Windows bind mount makes every request take seconds.
            - 'sail-vendor:/var/www/html/vendor'
        networks:
            - sail
        depends_on:
            - laravel.test
        restart: unless-stopped

    adminer:
        image: 'adminer:5'
        ports:
            # Local development only: bound to loopback.
            - '127.0.0.1:${ADMINER_PORT:-8089}:8080'
        environment:
            ADMINER_DEFAULT_DRIVER: sqlite
            ADMINER_DESIGN: pepa-linha
        volumes:
            - './database:/data'
            - './docker/adminer/login-password-less.php:/var/www/html/plugins-enabled/login-password-less.php:ro'
        networks:
            - sail
        restart: unless-stopped

networks:
    sail:
        driver: bridge

volumes:
    sail-vendor:
